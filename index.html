<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Grid Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        .dashboard-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        .input-group input {
            padding: 6px;
            width: 120px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-generate {
            background-color: #007bff;
            color: white;
            margin-right: 10px;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
        }
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .grid-btn {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .grid-btn.deselected {
            background-color: #6c757d;
        }
        .stats-panel {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .stats-panel p {
            margin: 5px 0;
            color: #495057;
        }
        .list-container {
            word-break: break-all;
            max-height: 60px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h2>Grid Configuration</h2>
    
    <div class="input-group">
        <label for="sessionIdInput">ID / Session Name</label>
        <input type="text" id="sessionIdInput" value="Session1">
    </div>

    <div class="input-group">
        <label for="fromInput">From Number</label>
        <input type="number" id="fromInput" value="1">
    </div>
    
    <div class="input-group">
        <label for="toInput">To Number</label>
        <input type="number" id="toInput" value="50">
    </div>
    
    <div>
        <button class="btn-generate" onclick="generateGrid()">Generate Grid</button>
    </div>

    <h2>Interactive Grid</h2>
    <div class="grid-container" id="gridContainer"></div>

    <div class="stats-panel">
        <p><strong>Total Selected Count:</strong> <span id="totalSelected">0</span></p>
        <p><strong>Total Deselected Count:</strong> <span id="totalDeselected">0</span></p>
        <p><strong>Deselected List:</strong> <span id="deselectedList" class="list-container">-</span></p>
    </div>

    <div>
        <button class="btn-submit" onclick="saveToGoogleSheet()">Save Selections to Google Sheet</button>
    </div>
</div>

<script>
    let allNumbers = [];
    let deselectedNumbers = [];

    function generateGrid() {
        const fromVal = parseInt(document.getElementById('fromInput').value);
        const toVal = parseInt(document.getElementById('toInput').value);
        const container = document.getElementById('gridContainer');
        
        container.innerHTML = '';
        allNumbers = [];
        deselectedNumbers = [];

        if (isNaN(fromVal) || isNaN(toVal)) {
            alert('Please enter valid numbers.');
            updateStats();
            return;
        }
        if (fromVal > toVal) {
            alert('"From" number cannot be greater than "To" number.');
            updateStats();
            return;
        }

        for (let i = fromVal; i <= toVal; i++) {
            allNumbers.push(i);
            
            const btn = document.createElement('button');
            btn.className = 'grid-btn';
            btn.innerText = i;
            btn.setAttribute('data-num', i);
            
            btn.onclick = function() {
                const num = parseInt(this.getAttribute('data-num'));
                if (this.classList.contains('deselected')) {
                    this.classList.remove('deselected');
                    deselectedNumbers = deselectedNumbers.filter(n => n !== num);
                } else {
                    this.classList.add('deselected');
                    deselectedNumbers.push(num);
                    deselectedNumbers.sort((a, b) => a - b);
                }
                updateStats();
            };
            
            container.appendChild(btn);
        }

        updateStats();
    }

    function updateStats() {
        const total = allNumbers.length;
        const deselectedCount = deselectedNumbers.length;
        const selectedCount = total - deselectedCount;

        document.getElementById('totalSelected').innerText = selectedCount;
        document.getElementById('totalDeselected').innerText = deselectedCount;
        document.getElementById('deselectedList').innerText = deselectedCount > 0 ? deselectedNumbers.join(', ') : '-';
    }

    function saveToGoogleSheet() {
        const sessionId = document.getElementById('sessionIdInput').value;
        const _from = document.getElementById('fromInput').value;
        const _to = document.getElementById('toInput').value;
        const selectedNumbers = allNumbers.filter(num => !deselectedNumbers.includes(num));
        const _money = selectedNumbers * 1.25;
        
        const payload = {
            id: sessionId,
            from: _from,
            to: _to,
            totalSelected: selectedNumbers.length,
            totalDeselected: deselectedNumbers.length,
            money: _money,
            deselectedList: deselectedNumbers,
            timestamp: new Date().toISOString()
        };

        // ⚠️ PASTE YOUR ACTUAL GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES BELOW ⚠️
        const GOOGLE_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzswBX2cU7bm9QD-axbZvlJytlvhrB4SUsMZVVMNe6U7qkoQsBA852yZZMX2jChwzQOpA/exec"; 

        fetch(GOOGLE_SCRIPT_WEBAPP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert("Success! Data sent to Google Sheet.");
        })
        .catch(err => {
            console.error("Transmission error:", err);
            alert("Error sending data to Google Sheet.");
        });
    }

    window.onload = function() {
        generateGrid();
    };
</script>
</body>
</html>

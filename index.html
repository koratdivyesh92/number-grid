<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Grid Generator</title>
    <style>
        :root {
            --bg-unselected: #f3f4f6;
            --text-unselected: #1f2937;
            --bg-selected: #b4c9e7;
            --text-selected: #1e3a8a;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f9fafb;
            color: #111827;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }
        h2 {
            margin-bottom: 16px;
            font-size: 1.25rem;
            text-align: center;
            color: #374151;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.875rem;
            font-weight: 500;
            color: #4b5563;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        button.btn-generate {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        button.btn-generate:hover {
            background-color: var(--primary-hover);
        }
        .grid-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: none;
            flex-direction: column;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .grid-button {
            aspect-ratio: 1;
            background-color: var(--bg-unselected);
            color: var(--text-unselected);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .grid-button.selected {
            background-color: var(--bg-selected);
            color: var(--text-selected);
        }
        .summary {
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
        }
        .summary-val {
            font-weight: bold;
        }
        .save-section {
            margin-top: 12px;
        }
        .btn-save {
            width: 100%;
            padding: 10px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-save:hover {
            background-color: #059669;
        }
        .status-msg {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 6px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Grid Configuration</h2>
        <div class="form-group">
            <label for="gridId">ID / Session Name</label>
            <input type="text" id="gridId" placeholder="e.g., Session_1">
        </div>
        <div class="form-group">
            <label for="fromNum">From Number</label>
            <input type="number" id="fromNum" placeholder="2">
        </div>
        <div class="form-group">
            <label for="toNum">To Number</label>
            <input type="number" id="toNum" placeholder="15">
        </div>
        <button class="btn-generate" onclick="generateGrid()">Generate Grid</button>
    </div>

    <div class="grid-container" id="gridBox">
        <h2 id="gridTitle">Interactive Grid</h2>
        <div class="grid" id="numberGrid"></div>
        <div class="summary">
            <div class="summary-row">
                <span>Total Selected Count:</span>
                <span class="summary-val" id="totalCount">0</span>
            </div>
            <div class="summary-row">
                <span>Selected List:</span>
                <span class="summary-val" id="selectedList">-</span>
            </div>
            <div class="save-section">
                <button class="btn-save" onclick="saveToGoogleSheet()">Save Selections to Google Sheet</button>
                <div class="status-msg" id="statusMessage"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedNumbers = new Set();
        // REPLACE THIS URL WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAsuEVI56cMfcDNUakedxB8Yf9PR_zb8ckd2V4OWzIMKtHmV2OAQIw_5NPJyDN0HWW/exec";

        function generateGrid() {
            const id = document.getElementById('gridId').value.trim() || "Unnamed_ID";
            const from = parseInt(document.getElementById('fromNum').value);
            const to = parseInt(document.getElementById('toNum').value);

            if (isNaN(from) || isNaN(to) || from > to) {
                alert("Please enter valid 'From' and 'To' numbers where 'From' is less than or equal to 'To'.");
                return;
            }

            selectedNumbers.clear();
            updateSummary();

            const gridContainer = document.getElementById('numberGrid');
            gridContainer.innerHTML = '';
            document.getElementById('gridTitle').innerText = `Grid for ${id}`;

            for (let i = from; i <= to; i++) {
                const btn = document.createElement('button');
                btn.className = 'grid-button';
                btn.innerText = i;
                btn.onclick = () => toggleNumber(i, btn);
                gridContainer.appendChild(btn);
            }

            document.getElementById('gridBox').style.display = 'flex';
            document.getElementById('statusMessage').innerText = '';
        }

        function toggleNumber(num, element) {
            if (selectedNumbers.has(num)) {
                selectedNumbers.delete(num);
                element.classList.remove('selected');
            } else {
                selectedNumbers.add(num);
                element.classList.add('selected');
            }
            updateSummary();
        }

        function updateSummary() {
            const arr = Array.from(selectedNumbers).sort((a, b) => a - b);
            document.getElementById('totalCount').innerText = arr.length;
            document.getElementById('selectedList').innerText = arr.length > 0 ? arr.join(', ') : '-';
        }

        function saveToGoogleSheet() {
            const id = document.getElementById('gridId').value.trim() || "Unnamed_ID";
            const count = selectedNumbers.size;
            const selections = Array.from(selectedNumbers).sort((a, b) => a - b).join(', ');
            const statusMsg = document.getElementById('statusMessage');

            if (GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                statusMsg.style.color = "red";
                statusMsg.innerText = "⚠️ Please set up your Google Apps Script Web App URL in the code first.";
                return;
            }

            statusMsg.style.color = "#4b5563";
            statusMsg.innerText = "Saving data...";

            const payload = {
                id: id,
                count: count,
                selections: selections
            };

            // Using fetch with no-cors or standard text post depending on Apps Script execution requirements
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusMsg.style.color = "green";
                statusMsg.innerText = "✅ Successfully saved to Google Sheet!";
            })
            .catch(err => {
                console.error(err);
                statusMsg.style.color = "red";
                statusMsg.innerText = "❌ Network error. Check console or URL.";
            });
        }
    </script>
</body>
</html>

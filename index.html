<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Button Selector</title>
    <style>
        :root {
            --primary-pastel: #b4c9e7; /* Soft Pastel Blue (Selected) */
            --bg-deselected: #f3f4f6;  /* Very Light Grey (Deselected) */
            --text-selected: #1e3a8a;  /* Deep Royal Blue text */
            --text-deselected: #6b7280;/* Slate Grey text */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #fafafa;
            color: #1f2937;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 1.25rem;
            color: #111827;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: #4b5563;
        }

        input {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 15px;
            cursor: pointer;
        }

        /* Ultra-compact 10-column mobile grid architecture */
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .grid-btn {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Default starting state: Selected (Pastel Blue) */
        .grid-btn.selected {
            background-color: var(--primary-pastel);
            color: var(--text-selected);
        }

        /* Clicked state: Deselected (Grey) */
        .grid-btn.deselected {
            background-color: var(--bg-deselected);
            color: var(--text-deselected);
        }

        .metrics {
            background-color: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .metric-row:last-child {
            margin-bottom: 0;
        }

        .bold-val {
            font-weight: 700;
        }

        .list-box {
            word-break: break-all;
            color: #ef4444; /* Highlights deselected list in soft muted red text */
        }

        .button-bar {
            display: flex;
            gap: 10px;
        }

        .submit-btn {
            flex: 2;
            padding: 12px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .reset-btn {
            flex: 1;
            padding: 12px;
            background-color: #6b7280;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Dynamic Number Dashboard</h2>
    
    <div class="input-group">
        <div class="field">
            <label for="session-id">ID</label>
            <input type="text" id="session-id" placeholder="e.g., User1">
        </div>
        <div class="field">
            <label for="num-from">From</label>
            <input type="number" id="num-from" value="1">
        </div>
        <div class="field">
            <label for="num-to">To</label>
            <input type="number" id="num-to" value="50">
        </div>
    </div>

    <button class="action-btn" onclick="generateGrid()">Generate Grid</button>

    <div id="number-grid" class="grid"></div>

    <div class="metrics">
        <div class="metric-row">
            <span>Total Selected:</span>
            <span id="selected-count" class="bold-val">0</span>
        </div>
        <div class="metric-row">
            <span>Total Deselected:</span>
            <span id="deselected-count" class="bold-val">0</span>
        </div>
        <div class="metric-row" style="flex-direction: column; margin-top: 8px;">
            <span style="font-weight: 600;">Deselected Numbers List:</span>
            <span id="deselected-list" class="bold-val list-box">None</span>
        </div>
    </div>

    <div class="button-bar">
        <button class="reset-btn" onclick="resetGrid()">Reset All</button>
        <button class="submit-btn" onclick="submitToGoogleSheets()">Submit Data</button>
    </div>
</div>

<script>
    // PASTE YOUR LIVE GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES BELOW
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAsuEVI56cMfcDNUakedxB8Yf9PR_zb8ckd2V4OWzIMKtHmV2OAQIw_5NPJyDN0HWW/exec";

    let activeRange = [];

    function generateGrid() {
        const fromVal = parseInt(document.getElementById('num-from').value);
        const toVal = parseInt(document.getElementById('num-to').value);
        const gridContainer = document.getElementById('number-grid');
        
        gridContainer.innerHTML = '';
        activeRange = [];

        if (isNaN(fromVal) || isNaN(toVal) || fromVal > toVal) {
            alert("Please enter a valid numeric range.");
            return;
        }

        // Populate array with sequential numbers and instantiate as 'selected' by default
        for (let i = fromVal; i <= toVal; i++) {
            activeRange.push({ number: i, selected: true });
        }

        activeRange.forEach((item, index) => {
            const btn = document.createElement('button');
            btn.className = 'grid-btn selected';
            btn.innerText = item.number;
            
            // Toggle selection state mapping on mobile touch/click
            btn.addEventListener('click', () => {
                activeRange[index].selected = !activeRange[index].selected;
                if (activeRange[index].selected) {
                    btn.className = 'grid-btn selected';
                } else {
                    btn.className = 'grid-btn deselected';
                }
                calculateMetrics();
            });

            gridContainer.appendChild(btn);
        });

        calculateMetrics();
    }

    function calculateMetrics() {
        const selected = activeRange.filter(item => item.selected).map(item => item.number);
        const deselected = activeRange.filter(item => !item.selected).map(item => item.number);

        document.getElementById('selected-count').innerText = selected.length;
        document.getElementById('deselected-count').innerText = deselected.length;
        
        document.getElementById('deselected-list').innerText = deselected.length > 0 ? deselected.join(', ') : 'None';
    }

    // Instantly selects all items back to starting states
    function resetGrid() {
        activeRange.forEach(item => item.selected = true);
        const buttons = document.querySelectorAll('.grid-btn');
        buttons.forEach(btn => btn.className = 'grid-btn selected');
        calculateMetrics();
    }

    function submitToGoogleSheets() {
        const idVal = document.getElementById('session-id').value.trim();
        if (!idVal) {
            alert("Please enter an ID before submitting.");
            return;
        }

        if (activeRange.length === 0) {
            alert("Please generate a grid before submitting data.");
            return;
        }

        if (GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL")) {
            alert("Configuration Error: Please update the script URL on line 160 with your live deployment API string.");
            return;
        }

        const selectedCount = activeRange.filter(item => item.selected).length;
        const deselectedCount = activeRange.filter(item => !item.selected).length;
        const deselectedList = activeRange.filter(item => !item.selected).map(item => item.number).join(', ');

        const payload = {
            id: idVal,
            count: "Selected: " + selectedCount + " | Deselected: " + deselectedCount,
            selections: deselectedList || "None"
        };

        // Post JSON block to the endpoint
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', 
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert("Data logged successfully!");
        })
        .catch(err => {
